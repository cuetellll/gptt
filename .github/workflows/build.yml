name: Build MahyarVPN

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri -> target'

      - name: Download sing-box 1.14 (Windows amd64)
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $h = @{ Authorization = "Bearer $env:GH_TOKEN"; 'User-Agent' = 'mahyarvpn-ci' }
          $rels = Invoke-RestMethod -Headers $h 'https://api.github.com/repos/SagerNet/sing-box/releases?per_page=100'
          $rel = $rels | Where-Object { $_.tag_name -like 'v1.14.*' -and -not $_.prerelease } | Select-Object -First 1
          if (-not $rel) { $rel = $rels | Where-Object { $_.tag_name -like 'v1.14.*' } | Select-Object -First 1 }
          if (-not $rel) { throw 'sing-box 1.14 release not found' }
          $asset = $rel.assets | Where-Object { $_.name -like '*-windows-amd64.zip' } | Select-Object -First 1
          Write-Host "Using sing-box $($rel.tag_name) -> $($asset.name)"
          Invoke-WebRequest $asset.browser_download_url -OutFile sb.zip
          Expand-Archive sb.zip -DestinationPath sb -Force
          New-Item -ItemType Directory -Force src-tauri/bin | Out-Null
          Get-ChildItem sb -Recurse -Filter sing-box.exe | Select-Object -First 1 | Copy-Item -Destination src-tauri/bin/sing-box.exe
          & ./src-tauri/bin/sing-box.exe version

      - name: Install frontend deps
        run: npm install

      - name: Check frontend and config tests
        shell: pwsh
        env:
          MAHYAR_CONFIG_OUTPUT: config-check
        run: |
          npm run typecheck
          if ($LASTEXITCODE -ne 0) { throw 'TypeScript check failed' }
          npm test
          if ($LASTEXITCODE -ne 0) { throw 'Config tests failed' }
          Get-ChildItem config-check/*.json | ForEach-Object {
            & ./src-tauri/bin/sing-box.exe check -c $_.FullName --disable-color
            if ($LASTEXITCODE -ne 0) { throw "sing-box rejected $($_.Name)" }
          }

      - name: Download and verify Aether v1.6.0 (Windows x86_64)
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $h = @{ Authorization = "Bearer $env:GH_TOKEN"; 'User-Agent' = 'mahyarvpn-ci' }
          $version = 'v1.6.0'
          $rel = Invoke-RestMethod -Headers $h "https://api.github.com/repos/CluvexStudio/Aether/releases/tags/$version"
          $asset = $rel.assets | Where-Object { $_.name -eq 'aether-windows-x86_64.zip' } | Select-Object -First 1
          $sums = $rel.assets | Where-Object { $_.name -eq 'SHA256SUMS.txt' } | Select-Object -First 1
          if (-not $asset -or -not $sums) { throw 'Required Aether archive or checksums missing' }
          Invoke-WebRequest $asset.browser_download_url -OutFile aether.zip
          Invoke-WebRequest $sums.browser_download_url -OutFile aether-SHA256SUMS.txt
          $entry = Get-Content aether-SHA256SUMS.txt | Where-Object { $_ -match '^[a-fA-F0-9]{64}\s+\*?aether-windows-x86_64\.zip$' } | Select-Object -First 1
          if (-not $entry) { throw 'Aether checksum entry missing' }
          $expected = ($entry.Trim() -split '\s+')[0]
          $actual = (Get-FileHash aether.zip -Algorithm SHA256).Hash
          if ($actual -ne $expected) { throw 'Aether SHA256 mismatch' }
          Expand-Archive aether.zip -DestinationPath aether -Force
          $exe = Get-ChildItem aether -Recurse -Filter aether.exe | Select-Object -First 1
          if (-not $exe) { throw 'aether.exe missing from verified archive' }
          Copy-Item $exe.FullName src-tauri/bin/aether.exe
          Invoke-WebRequest "https://raw.githubusercontent.com/CluvexStudio/Aether/$version/LICENSE" -OutFile src-tauri/bin/Aether-LICENSE.txt
          "Aether $version, CluvexStudio, AGPL-3.0. Upstream: https://github.com/CluvexStudio/Aether. Source snapshot: Aether-$version-source.zip (included with build artifacts). See THIRD-PARTY.md for distribution requirements." | Set-Content src-tauri/bin/Aether-SOURCE.txt
          New-Item -ItemType Directory -Force out | Out-Null
          Invoke-WebRequest "https://github.com/CluvexStudio/Aether/archive/refs/tags/$version.zip" -OutFile "out/Aether-$version-source.zip"
          & ./src-tauri/bin/aether.exe --help
          if ($LASTEXITCODE -ne 0) { throw 'Aether help check failed' }

      - name: Check Rust backend
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: Build app
        env:
          VITE_GH_OWNER: ${{ github.repository_owner }}
          VITE_GH_REPO: ${{ github.event.repository.name }}
          VITE_SUB_URL: ${{ vars.SUB_URL }}
        run: npm run tauri build

      - name: Package (Setup + Portable)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out/MahyarVPN-Portable | Out-Null
          Copy-Item src-tauri/target/release/mahyarvpn.exe out/MahyarVPN-Portable/MahyarVPN.exe
          Copy-Item src-tauri/bin/sing-box.exe out/MahyarVPN-Portable/sing-box.exe
          Copy-Item src-tauri/bin/aether.exe out/MahyarVPN-Portable/aether.exe
          Copy-Item src-tauri/bin/Aether-LICENSE.txt out/MahyarVPN-Portable/Aether-LICENSE.txt
          Copy-Item src-tauri/bin/Aether-SOURCE.txt out/MahyarVPN-Portable/Aether-SOURCE.txt
          Copy-Item THIRD-PARTY.md out/MahyarVPN-Portable/THIRD-PARTY.md
          Copy-Item out/Aether-v1.6.0-source.zip out/MahyarVPN-Portable/Aether-v1.6.0-source.zip
          Compress-Archive -Path out/MahyarVPN-Portable/* -DestinationPath out/MahyarVPN-Portable.zip -Force
          $setup = Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1
          Copy-Item $setup.FullName out/MahyarVPN-Setup.exe

      - uses: actions/upload-artifact@v4
        with:
          name: MahyarVPN-Windows
          path: |
            out/MahyarVPN-Setup.exe
            out/MahyarVPN-Portable.zip
            out/Aether-v1.6.0-source.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            out/MahyarVPN-Setup.exe
            out/MahyarVPN-Portable.zip
            out/Aether-v1.6.0-source.zip
